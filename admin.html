<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador | Pumas Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { padding: 40px; background: var(--dark); color: #fff; }
        .admin-container { max-width: 1000px; margin: 0 auto; background: var(--dark-card); border: 1px solid rgba(255,204,0,0.3); border-radius: 12px; padding: 40px; box-shadow: 0 0 40px rgba(0,0,0,0.9); }
        h2 { color: var(--accent-yellow); font-family: 'Orbitron'; margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { text-align: left; }
        .form-group label { display: block; color: var(--accent-yellow); font-family: 'Orbitron'; font-size: 0.85rem; margin-bottom: 8px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #0a0b10; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 6px; outline: none; }
        .btn-admin { background: linear-gradient(45deg, var(--accent-yellow), #ff9900); color: #000; padding: 14px; width: 100%; font-family: 'Orbitron'; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .user-table { width: 100%; border-collapse: collapse; margin-top: 25px; background: #0a0b10; border-radius: 6px; overflow: hidden; }
        .user-table th, .user-table td { padding: 12px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .user-table th { background: rgba(255,204,0,0.15); color: var(--accent-yellow); font-family: 'Orbitron'; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-action { padding: 6px 12px; border-radius: 4px; border: none; font-weight: 700; cursor: pointer; font-size: 0.8rem; margin: 0 3px; }
        .btn-edit { background: var(--primary); color: #000; }
        .btn-delete { background: var(--secondary); color: #fff; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="top-nav">
            <h2>Panel de Administrador - Gestión de Accesos</h2>
            <button onclick="cerrarSesion()" style="background: var(--secondary); color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-family: 'Orbitron';">Cerrar Sesión</button>
        </div>
        <p style="color: var(--gray); margin-bottom: 25px;">Crea cuentas, modifica permisos, actualiza claves o elimina usuarios de la Base de Datos.</p>

        <form id="formCreateUser">
            <h3 style="color: var(--primary); font-family: 'Orbitron'; margin-bottom: 15px; font-size: 1.1rem;">Crear Nuevo Usuario</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre de Usuario</label>
                    <input type="text" id="newUsername" required placeholder="Ej. operador_nova">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="newPassword" required placeholder="********">
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Asignar Rol</label>
                <select id="newRole" required>
                    <option value="resultadosascensos">resultadosascensos</option>
                    <option value="ligas privadas">ligas privadas</option>
                    <option value="quisqueya">quisqueya</option>
                    <option value="nova">nova</option>
                    <option value="rusheo">rusheo</option>
                    <option value="administrador">administrador</option>
                    <option value="rol_libre_1">Rol Libre 1</option>
                    <option value="rol_libre_2">Rol Libre 2</option>
                    <option value="rol_libre_3">Rol Libre 3</option>
                </select>
            </div>
            <button type="submit" class="btn-admin">Registrar Usuario</button>
            <div id="createMsg" style="margin-top: 15px; font-weight: 700;"></div>
        </form>

        <h3 style="color: #fff; font-family: 'Orbitron'; margin-top: 40px; font-size: 1.1rem; margin-bottom: 15px;">Usuarios Registrados</h3>
        <table class="user-table">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Rol / Permisos</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://modxcowgbbvpkjzuyuuy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vZHhjb3dnYmJ2cGtqenV5dXV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NTkzNzcsImV4cCI6MjEwMjAzNTM3N30.OCJXo9tFkTLq71cwCMwv_3Zu2DtDPSyLvszGdlHDlOM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = function() {
            const user = JSON.parse(localStorage.getItem('current_user'));
            if (!user || user.role !== 'administrador') {
                window.location.href = 'login.html';
                return;
            }
            cargarUsuariosBD();
        };

        // Crear usuario
        document.getElementById('formCreateUser').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const role = document.getElementById('newRole').value;
            const msgDiv = document.getElementById('createMsg');

            const { error } = await supabaseClient
                .from('usuarios')
                .insert([{ username, password, role }]);

            if (error) {
                msgDiv.style.color = 'var(--secondary)';
                msgDiv.innerText = 'Error: El usuario ya existe o faltan datos.';
            } else {
                msgDiv.style.color = 'var(--primary)';
                msgDiv.innerText = '¡Usuario creado exitosamente!';
                document.getElementById('formCreateUser').reset();
                cargarUsuariosBD();
            }
        });

        // Cargar tabla
        async function cargarUsuariosBD() {
            const { data, error } = await supabaseClient
                .from('usuarios')
                .select('*')
                .order('id', { ascending: false });

            if (!error && data) {
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';
                data.forEach(u => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${u.username}</strong></td>
                            <td><span style="color: var(--accent-yellow);">${u.role}</span></td>
                            <td>
                                <button class="btn-action btn-edit" onclick="modificarUsuario(${u.id}, '${u.username}', '${u.role}')">Modificar</button>
                                <button class="btn-action btn-delete" onclick="eliminarUsuario(${u.id}, '${u.username}')">Eliminar</button>
                            </td>
                        </tr>`;
                });
            }
        }

        // Modificar permisos o clave
        async function modificarUsuario(id, username, rolActual) {
            const nuevoRol = prompt(`Modificar rol para "${username}":`, rolActual);
            if (nuevoRol === null) return;
            const nuevaClave = prompt(`Nueva contraseña para "${username}" (dejar en blanco para no cambiarla):`, "");

            let updateData = { role: nuevoRol.trim() };
            if (nuevaClave.trim() !== "") {
                updateData.password = nuevaClave.trim();
            }

            const { error } = await supabaseClient
                .from('usuarios')
                .update(updateData)
                .eq('id', id);

            if (error) {
                alert('No se pudo actualizar el usuario.');
            } else {
                alert('Usuario actualizado correctamente.');
                cargarUsuariosBD();
            }
        }

        // Eliminar usuario
        async function eliminarUsuario(id, username) {
            if (!confirm(`¿Eliminar permanentemente a "${username}"?`)) return;

            const { error } = await supabaseClient
                .from('usuarios')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Error al eliminar el usuario.');
            } else {
                alert('Usuario eliminado.');
                cargarUsuariosBD();
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('current_user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
