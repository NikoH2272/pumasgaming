<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas de diseño · Resultados Pumas</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#141414;color:#f2f2f2;font:15px/1.5 Arial,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #dccc9c;outline-offset:3px}
    header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 28px;background:#202020}h1{font-size:22px;margin:0}header p{color:#b5b5b5;margin:4px 0 0}button{padding:10px 14px;background:#303030;color:#f2f2f2;border:0;border-radius:3px}button.primary{background:#dccc9c;color:#141414;font-weight:bold}button:disabled{opacity:.5;cursor:wait}
    .layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;padding:28px;max-width:1600px;margin:auto}.controls{background:#202020;padding:20px;align-self:start}.controls h2{font-size:17px;margin:0 0 18px}.field{display:grid;gap:6px;margin-bottom:15px}.field input,.field select{width:100%;padding:9px 10px;border:1px solid #535353;border-radius:3px;background:#141414;color:#f2f2f2}.check{display:flex;align-items:center;gap:8px;margin:14px 0}.check input{accent-color:#dccc9c}.controls p{font-size:13px;color:#b5b5b5}.gallery{min-width:0}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.tabs button[aria-selected=true]{background:#dccc9c;color:#141414;font-weight:bold}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}.status{min-height:24px;color:#dccc9c;margin-bottom:16px}.stage{overflow:hidden;background:#242424;width:100%;max-width:756px}.canvas{width:1080px;height:1350px;transform-origin:top left}.meta{color:#b5b5b5;margin-top:12px}a{color:#dccc9c}
    @media(max-width:850px){header{align-items:flex-start;padding:18px}.layout{grid-template-columns:1fr;padding:18px;gap:20px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.controls h2,.controls p,.checks{grid-column:1/-1}.controls .field{min-width:0}.stage{max-width:100%}}@media(max-width:430px){.controls{display:block}header{display:block}header button{margin-top:14px}}
  </style>
</head>
<body>
  <header><div><h1>Laboratorio de resultados Pumas</h1><p>Vista local con datos ficticios · No se conecta a Supabase</p></div><button id="recargar" type="button">Recargar diseño</button></header>
  <div class="layout">
    <aside class="controls" aria-label="Datos de prueba">
      <h2>Configurar prueba</h2>
      <label class="field">Salas<select id="salas"><option>4</option><option selected>5</option><option>6</option></select></label>
      <label class="field">Equipos<select id="equipos"><option>12</option><option selected>16</option></select></label>
      <label class="field">Fecha y hora<input id="fecha" type="datetime-local" value="2026-11-11T19:00"></label>
      <label class="field">Moderador<input id="moderador" value="COACH NIKO" maxlength="60"></label>
      <label class="field">Instagram de Pumas<input id="instagram" value="pumas.gaming.oficial" maxlength="60"></label>
      <div class="checks"><label class="check"><input id="largos" type="checkbox">Probar nombres largos</label><label class="check"><input id="sinDano" type="checkbox">Solo replay, sin daño ni gloo</label></div>
      <p>La imagen descargada conserva 1080 × 1350 px aunque aquí se vea reducida. Las modificaciones al código se ven al recargar el diseño.</p>
    </aside>
    <main class="gallery">
      <div id="estiloImg" style="margin-bottom:12px"></div>
      <div id="tabs" class="tabs" role="tablist" aria-label="Imágenes generadas"></div>
      <div class="actions"><button class="primary" id="descargar" type="button">Descargar esta imagen</button><button id="descargarTodas" type="button">Descargar todas</button></div>
      <div id="estado" class="status" role="status" aria-live="polite"></div>
      <div id="stage" class="stage" role="tabpanel" aria-label="Imagen seleccionada"><div id="canvas" class="canvas"></div></div>
      <p id="meta" class="meta"></p>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>window.PumasCompletos={MAPAS:{1:'Bermuda',2:'Kalahari',3:'Purgatorio'}};</script>
  <script src="../portal-kit/imagenes-resultados.js"></script>
  <script src="diseno-resultados.js"></script>
</body>
</html>
