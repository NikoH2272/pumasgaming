<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lista de Sorteo | Pumas Gaming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carter+One&family=Emilys+Candy&family=Jersey+25&family=Michroma&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/x-icon" href="imagenes/LOGO PUMAS WEB.png">
    <style>
        .tabla-sorteo { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.95rem; }
        .tabla-sorteo th { background: var(--primary); color: var(--dark); padding: 12px; font-family: 'Michroma', sans-serif; text-align: left; }
        .tabla-sorteo td { padding: 12px; border-bottom: 1px solid rgba(220, 204, 156, 0.2); color: var(--light); }
        .tabla-sorteo tr:hover { background: rgba(220, 204, 156, 0.05); }
        .badge-ticket { background: #121317; border: 1px solid var(--primary); color: var(--primary); padding: 4px 8px; border-radius: 4px; font-family: 'Michroma', sans-serif; font-weight: bold; letter-spacing: 1px; }
        .contador { font-family: 'Michroma', sans-serif; color: var(--primary); font-size: 1.2rem; }
        
        .btn-eliminar { background: rgba(255, 50, 50, 0.2); color: #ff6b6b; border: 1px solid #ff6b6b; padding: 5px 10px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .btn-eliminar:hover { background: #ff6b6b; color: white; }
        
        .controles-superiores { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }

        .pantalla-sorteador {
            background: #050507;
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(220, 204, 156, 0.2) inset;
        }
        .texto-ticket-animado {
            font-family: 'Michroma', sans-serif;
            font-size: 2.5rem;
            color: var(--light);
            letter-spacing: 3px;
            margin-bottom: 10px;
            min-height: 50px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .texto-equipo-animado {
            font-size: 1.5rem;
            color: var(--primary);
            font-family: 'Jersey 25', sans-serif;
            font-weight: bold;
            min-height: 35px;
        }
        .ganador-highlight {
            color: #ffdf00 !important;
            text-shadow: 0 0 30px rgba(255, 223, 0, 0.8) !important;
            transform: scale(1.1);
            transition: all 0.3s ease;
        }

        @media print {
            body { background: white !important; color: black !important; }
            .site-header, .controles-superiores, .col-acciones, .pantalla-sorteador { display: none !important; }
            .tool-section { padding: 0 !important; background: white !important; }
            .section-title { color: black !important; border-bottom: 2px solid black !important; }
            .tabla-sorteo, .tabla-sorteo th, .tabla-sorteo td { border: 1px solid #000 !important; color: black !important; }
            .tabla-sorteo th { background: #f0f0f0 !important; }
            .tabla-sorteo tr { page-break-inside: avoid; }
            .badge-ticket { background: transparent !important; border: none !important; color: black !important; }
            a { text-decoration: none !important; color: black !important; }
        }
    </style>
    <script src="portal-kit/portal.js?v=20261009n" data-modo="publico"></script>
</head>
<body>

<header class="site-header">
    <div class="logo-container">
        <img src="imagenes/LOGO PUMAS WEB.png" alt="Logo Pumas Gaming" class="logo-img">
        <div class="logo">PUMAS GAMING</div>
    </div>
    <nav class="main-nav">
        <ul>
            <li><a href="./" class="btn-access" style="padding: 8px 18px; font-size: 0.9rem;"><i class="fa-solid fa-arrow-left"></i> Volver al Inicio</a></li>
        </ul>
    </nav>
</header>

<section class="tool-section" style="min-height: calc(100vh - 76px);">
    <h2 class="section-title">Panel de Equipos Registrados</h2>
    
    <div class="tool-container" style="max-width: 1100px; margin: 0 auto; overflow-x: auto;">
        
        <div class="pantalla-sorteador">
            <h3 style="color: var(--gray); font-family: 'Michroma'; margin-bottom: 20px;">🎲 SORTEO EN VIVO 🎲</h3>
            
            <div id="pantallaTicket" class="texto-ticket-animado">PUMAS-XXXXX</div>
            <div id="pantallaEquipo" class="texto-equipo-animado">Nombre del Equipo</div>
            
            <div style="margin-top: 30px; display: flex; justify-content: center; gap: 15px;">
                <button onclick="iniciarRuleta()" class="btn-generar" style="width: auto; padding: 12px 30px; font-size: 1.1rem; max-width: 300px;">
                    <i class="fa-solid fa-play"></i> INICIAR SORTEO
                </button>
            </div>
        </div>

        <div class="controles-superiores">
            <div class="panel-fecha" style="background: rgba(220,204,156,0.05); padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed rgba(220, 204, 156, 0.3); display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                <label style="color: var(--primary); font-family: 'Michroma'; font-weight: bold;"><i class="fa-solid fa-clock"></i> FECHA LÍMITE DE INSCRIPCIÓN:</label>
                <input type="datetime-local" id="inputFechaLimite" style="padding: 10px; background: #0a0a0c; border: 1px solid rgba(220,204,156,0.5); color: white; border-radius: 6px; font-family: 'Jersey 25'; font-size: 1rem;">
                
                <button onclick="guardarFechaLimite()" class="btn-access" style="padding: 10px 20px; font-size: 0.9rem;">
                    <i class="fa-solid fa-save"></i> GUARDAR
                </button>
                <button onclick="borrarFechaLimite()" class="btn-eliminar" style="padding: 10px 20px; font-size: 0.9rem; background: transparent;">
                    <i class="fa-solid fa-times"></i> QUITAR LÍMITE
                </button>
                
                <span id="msgGuardado" style="color: #25D366; font-size: 0.95rem; font-weight: bold; display: none;"><i class="fa-solid fa-check"></i> ¡Actualizado!</span>
            </div>
            <div class="contador">
                Total Registrados: <span id="totalEquipos">Cargando...</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="generarEquiposPrueba()" class="btn-access" style="background: #333; color: white; padding: 10px 15px; font-size: 0.8rem; border: none; cursor: pointer;">
                    <i class="fa-solid fa-vial"></i> AGREGAR 15 PRUEBAS
                </button>
                <button onclick="window.print()" class="btn-generar" style="width: auto; padding: 10px 20px; font-size: 0.9rem;">
                    <i class="fa-solid fa-print"></i> IMPRIMIR LISTAS
                </button>
            </div>
        </div>

        <table class="tabla-sorteo" id="tablaImprimir">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Equipo</th>
                    <th>Representante</th>
                    <th>Instagram</th>
                    <th>Contacto</th>
                    <th>Ticket / Serial</th>
                    <th>Fecha</th>
                    <th class="col-acciones">Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTablaSorteo">
                <tr>
                    <td colspan="8" style="text-align: center; padding: 30px; color: var(--gray);">Cargando registros desde la base de datos...</td>
                </tr>
            </tbody>
        </table>

    </div>
</section>

<script>
    const supabaseUrl = "https://bqemjroiegybdzksddkn.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZW1qcm9pZWd5YmR6a3NkZGtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzgwNDIsImV4cCI6MjEwMzE1NDA0Mn0.49gC204FPWSNxWYa6eZFBgWJgr7ZvFax5mqOM9lyGPo";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    let listaGlobalEquipos = [];

    function formatearFecha(fechaString) {
        const opciones = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        return new Date(fechaString).toLocaleDateString('es-ES', opciones);
    }

    async function cargarEquiposSorteo() {
        try {
            const { data, error } = await supabaseClient
                .from('sorteo_equipos')
                .select('*')
                .order('fecha_registro', { ascending: false });

            if (error) throw error;

            listaGlobalEquipos = data;
            const cuerpoTabla = document.getElementById('cuerpoTablaSorteo');
            const totalTexto = document.getElementById('totalEquipos');
            
            totalTexto.innerText = data.length;

            if (data.length === 0) {
                cuerpoTabla.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--gray);">Aún no hay equipos registrados en el sorteo.</td></tr>`;
                return;
            }

            cuerpoTabla.innerHTML = "";
            data.forEach((registro, index) => {
                const fila = `
                    <tr>
                        <td style="font-weight: bold; color: var(--gray);">${index + 1}</td>
                        <td style="font-weight: bold; color: var(--light);">${registro.nombre_equipo}</td>
                        <td>${registro.nombre_representante}</td>
                        <td><a href="https://instagram.com/${registro.ig_equipo.replace('@', '')}" target="_blank" style="color: var(--primary); text-decoration: none;"><i class="fa-brands fa-instagram"></i> ${registro.ig_equipo}</a></td>
                        <td><a href="https://wa.me/${registro.numero_contacto.replace(/\s+/g, '').replace('+', '')}" target="_blank" style="color: #25D366; text-decoration: none;"><i class="fa-brands fa-whatsapp"></i> ${registro.numero_contacto}</a></td>
                        <td><span class="badge-ticket">${registro.codigo_serial}</span></td>
                        <td style="font-size: 0.8rem; color: var(--gray);">${formatearFecha(registro.fecha_registro)}</td>
                        <td class="col-acciones">
                            <button class="btn-eliminar" onclick="eliminarEquipo('${registro.id}', '${registro.nombre_equipo}')" title="Eliminar equipo">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
                cuerpoTabla.innerHTML += fila;
            });

        } catch (error) {
            console.error("Error al cargar los datos: ", error);
            document.getElementById('cuerpoTablaSorteo').innerHTML = `<tr><td colspan="8" style="text-align: center; color: red;">Error al cargar la base de datos.</td></tr>`;
        }
    }

    let intervaloRuleta;
    function iniciarRuleta() {
        if (listaGlobalEquipos.length === 0) {
            alert("No hay equipos registrados para sortear.");
            return;
        }

        const pantallaTicket = document.getElementById('pantallaTicket');
        const pantallaEquipo = document.getElementById('pantallaEquipo');
        
        pantallaTicket.classList.remove('ganador-highlight');
        pantallaEquipo.classList.remove('ganador-highlight');

        let tiempoIteracion = 50;
        let duracionTotal = 3000;
        let tiempoActual = 0;

        intervaloRuleta = setInterval(() => {
            const aleatorio = listaGlobalEquipos[Math.floor(Math.random() * listaGlobalEquipos.length)];
            pantallaTicket.innerText = aleatorio.codigo_serial;
            pantallaEquipo.innerText = aleatorio.nombre_equipo;
            tiempoActual += tiempoIteracion;

            if (tiempoActual >= duracionTotal) {
                clearInterval(intervaloRuleta);
                const ganadorFinal = listaGlobalEquipos[Math.floor(Math.random() * listaGlobalEquipos.length)];
                pantallaTicket.innerText = "🏆 " + ganadorFinal.codigo_serial + " 🏆";
                pantallaEquipo.innerText = "¡GANADOR: " + ganadorFinal.nombre_equipo.toUpperCase() + "!";
                
                pantallaTicket.classList.add('ganador-highlight');
                pantallaEquipo.classList.add('ganador-highlight');
            }
        }, tiempoIteracion);
    }

    async function generarEquiposPrueba() {
        const btnGenerar = document.querySelector('button[onclick="generarEquiposPrueba()"]');
        btnGenerar.innerText = "CREANDO...";
        btnGenerar.disabled = true;

        const prefijos = ["Team", "Squad", "Clan", "Los", "Gaming", "Elite", "Pro"];
        const nombres = ["Lobos", "Dragones", "Fénix", "Titanes", "Sombras", "Leyendas", "Tigres"];
        
        let nuevosEquipos = [];

        for(let i = 0; i < 15; i++) {
            const nomEquipo = `${prefijos[Math.floor(Math.random() * prefijos.length)]} ${nombres[Math.floor(Math.random() * nombres.length)]} ${Math.floor(Math.random() * 999)}`;
            const codigoAleatorio = Math.random().toString(36).substring(2, 7).toUpperCase();
            const codigoSerial = `PUMAS-${codigoAleatorio}`;

            nuevosEquipos.push({
                nombre_equipo: nomEquipo,
                nombre_representante: "Jugador Prueba " + (i+1),
                ig_equipo: "@equipo_" + Math.floor(Math.random() * 1000),
                numero_contacto: "+57 300" + Math.floor(1000000 + Math.random() * 9000000),
                codigo_serial: codigoSerial
            });
        }

        try {
            const { error } = await supabaseClient.from('sorteo_equipos').insert(nuevosEquipos);
            if (error) throw error;
            
            alert("✅ 15 Equipos de prueba agregados exitosamente.");
            cargarEquiposSorteo();
        } catch (error) {
            console.error(error);
            alert("❌ Error al generar equipos ficticios.");
        } finally {
            btnGenerar.innerHTML = `<i class="fa-solid fa-vial"></i> AGREGAR 15 PRUEBAS`;
            btnGenerar.disabled = false;
        }
    }

    async function eliminarEquipo(id, nombreEquipo) {
        const confirmacion = confirm(`⚠️ ¿Estás seguro de que deseas eliminar al equipo "${nombreEquipo}"?\nEsta acción es irreversible.`);
        if (confirmacion) {
            try {
                const { error } = await supabaseClient.from('sorteo_equipos').delete().eq('id', id);
                if (error) throw error;
                alert(`✅ El equipo "${nombreEquipo}" fue eliminado del sorteo.`);
                cargarEquiposSorteo();
            } catch (error) {
                alert("❌ Ocurrió un error al intentar eliminar el equipo.");
            }
        }
    }

    async function cargarFechaLimite() {
        const { data, error } = await supabaseClient.from('sorteo_config').select('fecha_limite').eq('id', 1).single();
        if (data && data.fecha_limite) {
            const dateObj = new Date(data.fecha_limite);
            const tzoffset = (new Date()).getTimezoneOffset() * 60000;
            const localISOTime = (new Date(dateObj - tzoffset)).toISOString().slice(0,16);
            document.getElementById('inputFechaLimite').value = localISOTime;
        } else {
            document.getElementById('inputFechaLimite').value = "";
        }
    }

    async function guardarFechaLimite() {
        const valor = document.getElementById('inputFechaLimite').value;
        if (!valor) {
            alert("Selecciona una fecha y hora primero.");
            return;
        }
        const fechaISO = new Date(valor).toISOString();
        
        const { error } = await supabaseClient.from('sorteo_config').upsert({ id: 1, fecha_limite: fechaISO });
        if (!error) mostrarMensajeExito();
    }

    async function borrarFechaLimite() {
        const { error } = await supabaseClient.from('sorteo_config').upsert({ id: 1, fecha_limite: null });
        if (!error) {
            document.getElementById('inputFechaLimite').value = "";
            mostrarMensajeExito();
        }
    }

    function mostrarMensajeExito() {
        const msg = document.getElementById('msgGuardado');
        msg.style.display = 'inline';
        setTimeout(() => msg.style.display = 'none', 3000);
    }

    window.addEventListener('DOMContentLoaded', () => {
        cargarEquiposSorteo();
        cargarFechaLimite();
    });
</script>

</body>
</html>
