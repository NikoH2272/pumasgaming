    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cupos de Entrenamientos | Pumas Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,700;1,800&family=Barlow:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=20261111a">
    <link rel="stylesheet" href="../portal-kit/tema-c.css?v=20261111l">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../portal-kit/portal.js?v=20261111b" data-portal="entrenamientos" data-modo="publico"></script>
</head>
<body class="c-tema">

<header class="site-header">
    <div class="logo-container">
        <img src="imagenes/LOGO PUMAS WEB.png" alt="Logo Pumas Gaming" class="logo-img">
        <div class="logo">PUMAS GAMING</div>
    </div>
    <button class="menu-toggle" aria-label="Abrir menú" aria-controls="mainNav" onclick="document.getElementById('mainNav').classList.toggle('is-active')">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
    <nav class="main-nav" id="mainNav">
        <ul>
            <li><a href="../"><i class="fa-solid fa-house"></i> Portal</a></li>
            <li><a href="./"><i class="fa-solid fa-globe"></i> Historial</a></li>
            <li><a href="estadisticas.html"><i class="fa-solid fa-chart-simple"></i> Estadísticas</a></li>
            <li><a href="cupos.html" style="color: var(--primary);"><i class="fa-solid fa-ticket"></i> Cupos Disponibles</a></li>
        </ul>
    </nav>
</header>

<section class="hero c-cab">
    <div class="c-rayo" aria-hidden="true"></div><div class="c-rayo fino" aria-hidden="true"></div>
    <h1>Reserva tu <em>cupo</em></h1>
    <p>Inscribe a tu equipo en las próximas sesiones de práctica oficiales.</p>
</section>

<main class="c-cupos" id="contenedorEntrenamientos" aria-live="polite">
    <p class="c-cupos-estado">Buscando entrenamientos disponibles...</p>
</main>

<!-- MODAL DE REGISTRO -->
<div id="modalRegistro" class="c-modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="c-modal-caja">
        <button type="button" class="c-modal-x" onclick="cerrarModal()" aria-label="Cerrar"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        <h3 id="modalTitulo" class="c-disp">Inscripción</h3>

        <input type="hidden" id="entrenamientoId">
        <input type="hidden" id="linkGrupoSecreto">

        <div class="c-campo">
            <label for="regNombre">Nombre del equipo o jugador</label>
            <input type="text" id="regNombre" placeholder="Ej: Pumas Squad" autocomplete="off">
        </div>

        <div class="c-campo">
            <label for="regTelefono">Teléfono de contacto</label>
            <div class="c-tel">
                <select id="regPais" aria-label="Código del país">
                    <option value="+57">CO +57</option>
                    <option value="+52">MX +52</option>
                    <option value="+54">AR +54</option>
                    <option value="+55">BR +55</option>
                    <option value="+56">CL +56</option>
                    <option value="+51">PE +51</option>
                    <option value="+593">EC +593</option>
                    <option value="+58">VE +58</option>
                    <option value="+591">BO +591</option>
                    <option value="+595">PY +595</option>
                    <option value="+598">UY +598</option>
                    <option value="+592">GY +592</option>
                    <option value="+502">GT +502</option>
                    <option value="+504">HN +504</option>
                    <option value="+503">SV +503</option>
                    <option value="+505">NI +505</option>
                    <option value="+506">CR +506</option>
                    <option value="+507">PA +507</option>
                    <option value="+501">BZ +501</option>
                    <option value="+1">US +1 (USA)</option>
                    <option value="+1">CA +1 (CA)</option>
                    <option value="+1">DO +1 (RD)</option>
                    <option value="+1">PR +1 (PR)</option>
                    <option value="+1">JM +1 (JM)</option>
                    <option value="+1">TT +1 (TT)</option>
                    <option value="+53">CU +53</option>
                    <option value="+509">HT +509</option>
                    <option value="+">Otro país</option>
                </select>
                <input type="number" id="regTelefono" placeholder="Número (sin espacios)" inputmode="tel">
            </div>
        </div>

        <button type="button" onclick="procesarInscripcion()" class="btn-access c-btn-cupo">Confirmar inscripción</button>
    </div>
</div>

<script src="script_cupos.js?v=20261111a"></script>
</body>
</html>
