<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pumas Gaming | Portal Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo">PUMAS GAMING</div>
        </div>
    </header>

    <section id="resultados" class="tool-section">
        <h2 class="section-title">Creador de Resultados - Conteo de Booyahs</h2>
        <div class="tool-container">
            <p class="tool-desc">Ingresa los equipos, configura las salas y registra el Top y Kills por sala[cite: 3].</p>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>CANTIDAD DE SALAS A JUGAR</label>
                    <input type="number" id="inputCantidadSalas" value="9" min="1" max="15" oninput="actualizarEstructuraEquipos()">
                </div>
                <div class="form-group">
                    <label>MODERADOR / ADMIN</label>
                    <input type="text" id="inputModerador" placeholder="Ej: Mod · PumasZee" oninput="renderizarResultados()">
                </div>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>LISTA DE EQUIPOS (Formato: Equipo - Tag)</label>
                <textarea id="inputEquipos" rows="10" class="form-group input" style="width: 100%; height: 150px; resize: vertical;" oninput="actualizarEstructuraEquipos()">
EQUIPO 1 - EQ1
EQUIPO 2 - EQ2
EQUIPO 3 - EQ3
EQUIPO 4 - EQ4
EQUIPO 5 - EQ5
EQUIPO 6 - EQ6
EQUIPO 7 - EQ7
EQUIPO 8 - EQ8
EQUIPO 9 - EQ9
EQUIPO 10 - EQ10
EQUIPO 11 - EQ11
EQUIPO 12 - EQ12
EQUIPO 13 - EQ13
EQUIPO 14 - EQ14
EQUIPO 15 - EQ15
EQUIPO 16 - EQ16
EQUIPO 17 - EQ17
EQUIPO 18 - EQ18</textarea>
            </div>

            <div id="contenedorSalasManuales" style="margin-top: 25px;"></div>

            <div style="margin-top: 40px; text-align: center;">
                <button class="btn-generar" onclick="descargarTablaReducida()" style="max-width: 400px; display: inline-block;">
                    <i class="fa-solid fa-download"></i> Descargar Imagen Final (2000x2000)
                </button>
            </div>
            
            <div id="outputTablaReducida" style="margin-top: 30px; display: flex; justify-content: center; overflow-x: auto;"></div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 PUMAS GAMING. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
